<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>海洋路中学2026新生报到分组查询</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b54d4;
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --text: #2d3748;
    --text-secondary: #718096;
    --border: #e2e8f0;
    --success: #48bb78;
    --warning: #ecc94b;
    --danger: #fc8181;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
    --shadow-lg: 0 20px 40px -8px rgba(0,0,0,0.1);
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .background-decoration {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.06;
  }
  .bg-circle.c1 { width: 500px; height: 500px; top: -150px; left: -100px; background: var(--primary); }
  .bg-circle.c2 { width: 400px; height: 400px; bottom: -120px; right: -80px; background: #3b82f6; }
  .bg-circle.c3 { width: 300px; height: 300px; top: 40%; left: 60%; background: #6366f1; }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--primary), #6366f1);
    border-radius: 20px;
    font-size: 30px;
    color: white;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(79,110,247,0.3);
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }

  /* Search */
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .search-input-wrapper {
    flex: 1;
    position: relative;
  }
  .search-input-wrapper .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #a0aec0;
    font-size: 18px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    font-size: 20px;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: all 0.2s;
    color: var(--text);
    background: #f8fafc;
  }
  .search-input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(79,110,247,0.1);
  }
  .search-input::placeholder { color: #cbd5e0; }

  .search-btn {
    padding: 13px 24px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .search-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .search-btn:active { transform: translateY(0); }

  /* Hint */
  .search-hint {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .search-hint .tag {
    display: inline-block;
    padding: 2px 8px;
    background: #edf2f7;
    border-radius: 10px;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s;
    color: var(--text-secondary);
  }
  .search-hint .tag:hover { background: #e2e8f0; color: var(--text); }

  /* Result */
  .result-area {
    min-height: 80px;
  }
  .result-empty {
    text-align: center;
    padding: 40px 20px;
    color: #cbd5e0;
  }
  .result-empty .empty-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 10px;
  }
  .result-empty .empty-text {
    font-size: 14px;
  }

  .result-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 12px;
    background: #f7fafc;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    transition: all 0.2s;
  }
  .result-item:hover {
    border-color: #c4d3ef;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .result-item .group-badge {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px; height: 56px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 20px;
    color: white;
  }
  .result-item .info { flex: 1; min-width: 0; }
  .result-item .info .name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .result-item .info .group-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .result-item .info .group-label strong {
    color: var(--primary);
    font-size: 16px;
  }
  .result-item .arrow {
    color: #cbd5e0;
    font-size: 20px;
  }

  .result-not-found {
    text-align: center;
    padding: 30px 20px;
  }
  .result-not-found .nf-icon {
    font-size: 52px;
    display: block;
    margin-bottom: 10px;
  }
  .result-not-found .nf-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .result-not-found .nf-hint {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .result-count {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* Group colors - cycle through distinct hues */
  .group-c0 { background: linear-gradient(135deg, #4f6ef7, #6366f1); }  /* indigo */
  .group-c1 { background: linear-gradient(135deg, #f59e0b, #d97706); }  /* amber */
  .group-c2 { background: linear-gradient(135deg, #10b981, #059669); }  /* emerald */
  .group-c3 { background: linear-gradient(135deg, #ef4444, #dc2626); }  /* red */
  .group-c4 { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }  /* violet */
  .group-c5 { background: linear-gradient(135deg, #ec4899, #db2777); }  /* pink */
  .group-c6 { background: linear-gradient(135deg, #14b8a6, #0d9488); }  /* teal */
  .group-c7 { background: linear-gradient(135deg, #f97316, #ea580c); }  /* orange */
  .group-c8 { background: linear-gradient(135deg, #06b6d4, #0891b2); }  /* cyan */
  .group-c9 { background: linear-gradient(135deg, #84cc16, #65a30d); }  /* lime */

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #a0aec0;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    .header h1 { font-size: 22px; }
    .search-input { font-size: 15px; }
    .result-item .group-badge { width: 48px; height: 48px; font-size: 17px; border-radius: 12px; }
    .result-item .info .name { font-size: 16px; }
  }
</style>

": "10组"}, {"name": "朱骏宁", "group": "10组"}, {"name": "朱玺恺", "group": "10组"}, {"name": "朱馨妍", "group": "10组"}, {"name": "竹紫恬", "group": "10组"}, {"name": "祝子轩", "group": "10组"}, {"name": "邹雨萱", "group": "10组"}];

// ===== Build index: name → [groups] =====
const nameIndex = new Map();
STUDENTS.forEach(s => {
  if (!nameIndex.has(s.name)) nameIndex.set(s.name, []);
  nameIndex.get(s.name).push(s.group);
});

// ===== Color mapping for groups =====
const GROUP_COLORS = {
  '1组': 'group-c0', '2组': 'group-c1', '3组': 'group-c2',
  '4组': 'group-c3', '5组': 'group-c4', '6组': 'group-c5',
  '7组': 'group-c6', '8组': 'group-c7', '9组': 'group-c8',
  '10组': 'group-c9'
};

// ===== DOM =====
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const resultArea = document.getElementById('resultArea');

// ===== Search function =====
function doSearch() {
  const query = searchInput.value.trim();

  if (!query) {
    showEmpty();
    return;
  }

  // 1. Exact match first
  if (nameIndex.has(query)) {
    const groups = nameIndex.get(query);
    const unique = [...new Set(groups)];
    if (unique.length === 1) {
      showResult(query, unique[0]);
    } else {
      showMultipleResults(query, unique);
    }
    return;
  }

  // 2. Partial match (contains)
  const matches = [];
  for (const [name, groups] of nameIndex) {
    if (name.includes(query)) {
      groups.forEach(g => matches.push({name, group: g}));
    }
  }

  // Deduplicate by name+group
  const seen = new Set();
  const uniqueMatches = [];
  for (const m of matches) {
    const key = m.name + '|' + m.group;
    if (!seen.has(key)) {
      seen.add(key);
      uniqueMatches.push(m);
    }
  }

  if (uniqueMatches.length === 0) {
    showNotFound(query);
  } else if (uniqueMatches.length === 1) {
    showResult(uniqueMatches[0].name, uniqueMatches[0].group);
  } else {
    showMultipleMatches(uniqueMatches);
  }
}

function showResult(name, group) {
  const colorClass = GROUP_COLORS[group] || 'group-c0';
  resultArea.innerHTML = `
    <div class="result-item" style="animation: fadeInUp 0.3s ease;">
      <div class="group-badge ${colorClass}">${group}</div>
      <div class="info">
        <div class="name">${escapeHtml(name)}</div>
        <div class="group-label">报到组别：<strong>${group}</strong></div>
      </div>
      <div class="arrow">→</div>
    </div>
  `;
}

function showMultipleResults(name, groups) {
  const items = groups.map((g, i) => {
    const colorClass = GROUP_COLORS[g] || 'group-c0';
    return `
      <div class="result-item" style="animation: fadeInUp ${0.2 + i * 0.05}s ease both;">
        <div class="group-badge ${colorClass}">${g}</div>
        <div class="info">
          <div class="name">${escapeHtml(name)}</div>
          <div class="group-label">报到组别：<strong>${g}</strong></div>
        </div>
        <div class="arrow">→</div>
      </div>
    `;
  }).join('');
  resultArea.innerHTML = `
    <div class="result-count">🔔 该姓名对应 ${groups.length} 条记录（同名不同组）：</div>
    ${items}
  `;
}

function showMultipleMatches(matches) {
  const items = matches.map((m, i) => {
    const colorClass = GROUP_COLORS[m.group] || 'group-c0';
    return `
      <div class="result-item" style="animation: fadeInUp ${0.2 + i * 0.04}s ease both;">
        <div class="group-badge ${colorClass}">${m.group}</div>
        <div class="info">
          <div class="name">${escapeHtml(m.name)}</div>
          <div class="group-label">报到组别：<strong>${m.group}</strong></div>
        </div>
        <div class="arrow">→</div>
      </div>
    `;
  }).join('');
  resultArea.innerHTML = `
    <div class="result-count">🔍 找到 ${matches.length} 条匹配记录：</div>
    <div style="max-height: 360px; overflow-y: auto;">${items}</div>
  `;
}

function showNotFound(query) {
  resultArea.innerHTML = `
    <div class="result-not-found" style="animation: fadeInUp 0.3s ease;">
      <span class="nf-icon">😕</span>
      <div class="nf-title">未找到"${escapeHtml(query)}"</div>
      <div class="nf-hint">请检查姓名是否输入正确，或尝试只输入姓氏</div>
    </div>
  `;
}

function showEmpty() {
  resultArea.innerHTML = `
    <div class="result-empty">
      <span class="empty-icon">📋</span>
      <span class="empty-text">共有 ${STUDENTS.length} 名新生 | 分为 10 个组别</span>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function quickSearch(el) {
  searchInput.value = el.textContent.trim();
  searchInput.focus();
  doSearch();
}

// ===== Event listeners =====
searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
// Real-time search as user types
let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doSearch, 250);
});

// ===== Animation =====
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
`;
document.head.appendChild(style);
