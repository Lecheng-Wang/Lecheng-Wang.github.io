<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海洋路中学初2026级新生入学体验课分班查询</title>
<style>
  :root {
    --primary: #1777d8;
    --primary-dark: #0e5ca8;
    --accent: #21b5c9;
    --bg: #eef5fb;
    --card-bg: #ffffff;
    --text: #1f2d3d;
    --text-secondary: #6b7a8d;
    --border: #e1ecf4;
    --shadow: 0 4px 6px -1px rgba(15, 70, 120, 0.08), 0 2px 4px -1px rgba(15, 70, 120, 0.04);
    --shadow-lg: 0 24px 48px -12px rgba(15, 70, 120, 0.18);
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .background-decoration {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
    background:
      linear-gradient(180deg, #e3f1fb 0%, #eef5fb 45%, #f6fafd 100%);
  }

  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.10;
  }
  .bg-circle.c1 { width: 560px; height: 560px; top: -180px; left: -120px; background: var(--primary); }
  .bg-circle.c2 { width: 440px; height: 440px; bottom: -140px; right: -100px; background: var(--accent); }
  .bg-circle.c3 { width: 300px; height: 300px; top: 38%; left: 62%; background: #4f9fe8; }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
  }

  /* Header */
  .header { text-align: center; margin-bottom: 26px; }
  .header .logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 88px; height: 88px;
    background: #ffffff;
    border-radius: 50%;
    margin-bottom: 16px;
    box-shadow: 0 10px 28px rgba(23, 119, 216, 0.22);
    border: 3px solid #ffffff;
    outline: 2px solid rgba(23, 119, 216, 0.18);
    overflow: hidden;
  }
  .header .logo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .header p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }

  /* Search */
  .search-box { display: flex; gap: 10px; margin-bottom: 18px; }
  .search-input-wrapper { flex: 1; position: relative; }
  .search-input-wrapper .search-icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #a7b9ca; font-size: 18px; pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 13px 14px 13px 42px;
    font-size: 18px;
    border: 2px solid var(--border);
    border-radius: 13px;
    outline: none;
    transition: all 0.2s;
    color: var(--text);
    background: #f7fbfe;
  }
  .search-input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 4px rgba(23, 119, 216, 0.12);
  }
  .search-input::placeholder { color: #b7c6d6; }

  .search-btn {
    padding: 13px 24px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    border: none;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    box-shadow: 0 6px 16px rgba(23, 119, 216, 0.25);
  }
  .search-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .search-btn:active { transform: translateY(0); }

  /* Hint */
  .search-hint {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .search-hint .tag {
    display: inline-block;
    padding: 3px 10px;
    background: #eaf3fa;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--primary-dark);
    font-weight: 500;
  }
  .search-hint .tag:hover { background: #d7e9f7; }

  /* Result */
  .result-area { min-height: 80px; }
  .result-empty { text-align: center; padding: 42px 20px; color: #b7c6d6; }
  .result-empty .empty-icon { font-size: 48px; display: block; margin-bottom: 10px; }
  .result-empty .empty-text { font-size: 14px; }

  .result-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 14px;
    background: #f7fbfe;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    transition: all 0.2s;
  }
  .result-item:hover {
    border-color: #bcd9f2;
    box-shadow: 0 2px 10px rgba(15, 70, 120, 0.06);
  }
  .result-item .group-badge {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    height: 42px;
    padding: 0 16px;
    white-space: nowrap;
    border-radius: 12px;
    font-weight: 700;
    font-size: 19px;
    color: white;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  .result-item .info { flex: 1; min-width: 0; }
  .result-item .info .name { font-size: 19px; font-weight: 600; color: var(--text); }
  .result-item .info .meta {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .result-item .info .meta .exam {
    font-family: 'SFMono-Regular', Consolas, monospace;
    color: var(--primary);
    background: #eaf3fa;
    padding: 1px 7px;
    border-radius: 6px;
  }
  .result-item .info .meta .birth { color: var(--text-secondary); }
  .result-item .arrow { color: #c3d3e1; font-size: 20px; }

  .result-not-found { text-align: center; padding: 30px 20px; }
  .result-not-found .nf-icon { font-size: 52px; display: block; margin-bottom: 10px; }
  .result-not-found .nf-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .result-not-found .nf-hint { font-size: 13px; color: var(--text-secondary); }

  .result-count {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* Group colors - 12 distinct hues */
  .group-c0  { background: linear-gradient(135deg, #2563eb, #1d4ed8); } /* 蓝 */
  .group-c1  { background: linear-gradient(135deg, #0891b2, #0e7490); } /* 青 */
  .group-c2  { background: linear-gradient(135deg, #14b8a6, #0d9488); } /* 湖蓝 */
  .group-c3  { background: linear-gradient(135deg, #10b981, #059669); } /* 绿 */
  .group-c4  { background: linear-gradient(135deg, #f59e0b, #d97706); } /* 琥珀 */
  .group-c5  { background: linear-gradient(135deg, #f97316, #ea580c); } /* 橙 */
  .group-c6  { background: linear-gradient(135deg, #ef4444, #dc2626); } /* 红 */
  .group-c7  { background: linear-gradient(135deg, #f43f5e, #e11d48); } /* 玫红 */
  .group-c8  { background: linear-gradient(135deg, #8b5cf6, #7c3aed); } /* 紫 */
  .group-c9  { background: linear-gradient(135deg, #6366f1, #4f46e5); } /* 靛 */
  .group-c10 { background: linear-gradient(135deg, #ec4899, #db2777); } /* 粉 */
  .group-c11 { background: linear-gradient(135deg, #84cc16, #65a30d); } /* 青柠 */

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: #a0b3c4;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .card { padding: 20px 16px; }
    .header h1 { font-size: 22px; }
    .header .logo-wrap { width: 76px; height: 76px; }
    .search-input { font-size: 16px; }
    .result-item .group-badge { min-width: 56px; height: 38px; padding: 0 13px; font-size: 17px; border-radius: 10px; }
    .result-item .info .name { font-size: 17px; }
  }
</style>
</head>

// ===== Build indexes =====
const nameIndex = new Map();   // baseName -> [student, ...]
const examIndex = new Map();   // exam (upper, no G) -> student

STUDENTS.forEach(s => {
  if (!nameIndex.has(s.n)) nameIndex.set(s.n, []);
  nameIndex.get(s.n).push(s);
  const norm = s.e.toUpperCase().replace(/^G/, '');
  examIndex.set(s.e.toUpperCase(), s);
  examIndex.set(norm, s);
});

function colorClass(group) { return 'group-c' + ((group - 1) % 12); }

function fmtBirth(b) {
  if (!b || b.length !== 8) return '';
  return b.slice(0, 4) + '-' + b.slice(4, 6) + '-' + b.slice(6, 8);
}

// ===== DOM =====
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const resultArea = document.getElementById('resultArea');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function metaLine(s) {
  const parts = [];
  if (s.e) parts.push('<span class="exam">' + escapeHtml(s.e) + '</span>');
  if (s.b) parts.push('<span class="birth">出生 ' + escapeHtml(fmtBirth(s.b)) + '</span>');
  return parts.join('');
}

function itemHtml(s, idx) {
  const delay = (0.2 + idx * 0.05).toFixed(2);
  return `
    <div class="result-item" style="animation: fadeInUp ${delay}s ease both;">
      <div class="group-badge ${colorClass(s.g)}">体验${s.g}班</div>
      <div class="info">
        <div class="name">${escapeHtml(s.n)}</div>
        <div class="meta">${metaLine(s)}</div>
      </div>
      <div class="arrow">→</div>
    </div>
  `;
}

function renderList(list, heading) {
  const items = list.map(itemHtml).join('');
  resultArea.innerHTML = `
    <div class="result-count">${heading}</div>
    <div style="max-height: 400px; overflow-y: auto;">${items}</div>
  `;
}

function doSearch() {
  const query = searchInput.value.trim();

  if (!query) { showEmpty(); return; }

  const qUpper = query.toUpperCase();
  const qNorm = qUpper.replace(/^G/, '');

  // 1. exact exam-number match
  if (examIndex.has(qUpper) || examIndex.has(qNorm)) {
    const s = examIndex.get(qUpper) || examIndex.get(qNorm);
    renderList([s], '🎯 按考号匹配到 1 条记录：');
    return;
  }

  // 2. exact name match (may include same-name duplicates)
  if (nameIndex.has(query)) {
    const list = nameIndex.get(query);
    if (list.length === 1) {
      renderList(list, '🎯 查询到 1 条记录：');
    } else {
      renderList(list, `🔔 该姓名对应 ${list.length} 位同名新生，请按出生日期区分：`);
    }
    return;
  }

  // 3. partial match (contains)
  const matches = [];
  for (const [name, list] of nameIndex) {
    if (name.includes(query)) {
      list.forEach(s => matches.push(s));
    }
  }

  if (matches.length === 0) {
    showNotFound(query);
  } else {
    matches.sort((a, b) => (a.g - b.g) || a.n.localeCompare(b.n, 'zh'));
    renderList(matches, `🔍 找到 ${matches.length} 条匹配记录：`);
  }
}

function showNotFound(query) {
  resultArea.innerHTML = `
    <div class="result-not-found" style="animation: fadeInUp 0.3s ease;">
      <span class="nf-icon">😕</span>
      <div class="nf-title">未找到 "${escapeHtml(query)}"</div>
      <div class="nf-hint">请核对姓名或考号是否输入正确，也可只输入姓氏试试</div>
    </div>
  `;
}

function showEmpty() {
  resultArea.innerHTML = `
    <div class="result-empty">
      <span class="empty-icon">📋</span>
      <span class="empty-text">向海而兴 · 向海图强</span>
    </div>
  `;
}

function quickSearch(el) {
  searchInput.value = el.textContent.trim();
  searchInput.focus();
  doSearch();
}

// ===== Event listeners =====
searchBtn.addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// ===== Animation =====
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
`;
document.head.appendChild(style);
</script>
